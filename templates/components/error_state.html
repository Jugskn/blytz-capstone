<div class="rounded-lg border border-danger bg-danger/5 px-4 py-6 text-center {{ class }}" role="alert">
  <h2 class="font-display text-lg text-ink">{{ title|default:"Something went wrong" }}</h2>
  {% if description %}
  <p class="mt-2 text-sm text-ink-muted">{{ description }}</p>
  {% endif %}
  {% if action_href and action_label %}
  <div class="mt-4">
    {% include "components/button.html" with label=action_label href=action_href variant="secondary" %}
  </div>
  {% endif %}
</div>
