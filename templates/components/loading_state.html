<div class="flex flex-col items-center justify-center gap-3 rounded-lg border border-dashed border-border bg-surface px-6 py-12 text-center {{ class }}" role="status" aria-live="polite" aria-busy="true">
  <span class="inline-block h-8 w-8 animate-spin rounded-full border-2 border-border-strong border-t-ink" aria-hidden="true"></span>
  <p class="text-sm text-ink-muted">{{ message|default:"Loading…" }}</p>
</div>
