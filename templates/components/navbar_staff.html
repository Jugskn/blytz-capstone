<header class="border-b border-border-strong bg-ink text-canvas" style="padding-top:env(safe-area-inset-top)">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
    <a href="{% url 'staff_home' %}" class="font-display text-xl text-canvas focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-canvas">
      Blytz <span class="text-sm font-sans font-normal text-canvas/60">Staff</span>
    </a>
    <button type="button" class="nav-hamburger inline-flex min-h-11 min-w-11 items-center justify-center rounded-md border border-canvas/30 text-canvas" data-nav-open="staff-nav-drawer" aria-label="Open menu">☰</button>
    <nav class="nav-desktop flex-wrap items-center justify-end gap-1 text-sm sm:gap-3" aria-label="Staff">
      <a href="{% url 'staff_home' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-canvas/70 hover:text-canvas">Overview</a>
      <a href="{% url 'jobs_pipeline' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-canvas/70 hover:text-canvas">Jobs</a>
      <a href="{% url 'accounting_list' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-canvas/70 hover:text-canvas">Accounting</a>
      <a href="{% url 'sales_pipeline' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-canvas/70 hover:text-canvas">Sales</a>
      {% if user.is_admin_role %}
      <a href="{% url 'payment_channel_list' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-canvas/70 hover:text-canvas">Channels</a>
      <a href="{% url 'user_manage_list' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-canvas/70 hover:text-canvas">Users</a>
      {% endif %}
      <a href="{% url 'account_profile' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-canvas/70 hover:text-canvas">Profile</a>
      <a href="{% url 'account_logout' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-canvas/70 hover:text-canvas">Log out</a>
    </nav>
  </div>
</header>
<div id="staff-nav-drawer" class="nav-drawer">
  <div class="nav-drawer-backdrop" data-nav-close></div>
  <div class="nav-drawer-panel staff" role="dialog" aria-label="Staff menu">
    <div class="mb-4 flex items-center justify-between">
      <span class="font-display text-lg text-canvas">Blytz Staff</span>
      <button type="button" class="inline-flex min-h-11 min-w-11 items-center justify-center text-canvas" data-nav-close aria-label="Close">×</button>
    </div>
    <nav class="flex flex-col gap-1 text-sm text-canvas">
      <a href="{% url 'staff_home' %}" class="min-h-11 rounded-md px-2 py-3 text-canvas/80" data-nav-close>Overview</a>
      <a href="{% url 'jobs_pipeline' %}" class="min-h-11 rounded-md px-2 py-3 text-canvas/80" data-nav-close>Jobs</a>
      <a href="{% url 'accounting_list' %}" class="min-h-11 rounded-md px-2 py-3 text-canvas/80" data-nav-close>Accounting</a>
      <a href="{% url 'sales_pipeline' %}" class="min-h-11 rounded-md px-2 py-3 text-canvas/80" data-nav-close>Sales</a>
      {% if user.is_admin_role %}
      <a href="{% url 'payment_channel_list' %}" class="min-h-11 rounded-md px-2 py-3 text-canvas/80" data-nav-close>Channels</a>
      <a href="{% url 'user_manage_list' %}" class="min-h-11 rounded-md px-2 py-3 text-canvas/80" data-nav-close>Users</a>
      {% endif %}
      <a href="{% url 'account_profile' %}" class="min-h-11 rounded-md px-2 py-3 text-canvas/80" data-nav-close>Profile</a>
      <a href="{% url 'account_logout' %}" class="min-h-11 rounded-md px-2 py-3 text-canvas/80" data-nav-close>Log out</a>
    </nav>
  </div>
</div>
