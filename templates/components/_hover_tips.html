<style>
  .bz-tip{position:fixed;z-index:9999;max-width:18rem;padding:.5rem .75rem;border-radius:.6rem;
    background:#0a0a0a;color:#fff;font-size:.74rem;font-weight:500;line-height:1.45;
    white-space:pre-line;text-align:left;pointer-events:none;
    border:1px solid rgba(212,175,55,.5);box-shadow:0 12px 30px rgba(0,0,0,.28);
    opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
  .bz-tip.is-on{opacity:1;transform:translateY(0)}
  [data-tip]{cursor:help}

  /* Pipeline cards: lift + gold border on hover */
  .pipeline-phase a.block{transition:transform .15s,box-shadow .15s,border-color .15s}
  .pipeline-phase a.block:hover{transform:translateY(-2px);border-color:#D4AF37!important;
    box-shadow:0 10px 24px rgba(0,0,0,.10)}
</style>
<script>
  (function () {
    if (window.__bzTip) return;
    window.__bzTip = true;
    document.addEventListener("DOMContentLoaded", function () {
      var tip = document.createElement("div");
      tip.className = "bz-tip";
      tip.setAttribute("role", "tooltip");
      document.body.appendChild(tip);
      var current = null;

      function show(el) {
        var text = el.getAttribute("data-tip");
        if (!text) return;
        current = el;
        tip.textContent = text;
        tip.style.left = "0px";
        tip.style.top = "0px";
        var r = el.getBoundingClientRect();
        var t = tip.getBoundingClientRect();
        var left = Math.max(8, Math.min(window.innerWidth - t.width - 8, r.left + r.width / 2 - t.width / 2));
        var top = r.top - t.height - 8;
        if (top < 8) top = r.bottom + 8;
        tip.style.left = left + "px";
        tip.style.top = top + "px";
        tip.classList.add("is-on");
      }
      function hide() {
        current = null;
        tip.classList.remove("is-on");
      }

      document.addEventListener("mouseover", function (e) {
        var el = e.target.closest ? e.target.closest("[data-tip]") : null;
        if (el && el !== current) show(el);
      });
      document.addEventListener("mouseout", function (e) {
        var el = e.target.closest ? e.target.closest("[data-tip]") : null;
        if (el && (!e.relatedTarget || !el.contains(e.relatedTarget))) hide();
      });
      document.addEventListener("focusin", function (e) {
        var el = e.target.closest ? e.target.closest("[data-tip]") : null;
        if (el) show(el);
      });
      document.addEventListener("focusout", hide);
      window.addEventListener("scroll", hide, true);
    });
  })();
</script>
