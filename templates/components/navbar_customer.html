<header class="sticky top-0 z-50 border-b border-border bg-canvas" style="padding-top:env(safe-area-inset-top)">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
    <a href="{% url 'home' %}" class="font-display text-xl text-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">Blytz</a>
    <button type="button" class="nav-hamburger inline-flex min-h-11 min-w-11 items-center justify-center rounded-md border border-border" data-nav-open="customer-nav-drawer" aria-label="Open menu">☰</button>
    <nav class="nav-desktop flex-wrap items-center justify-end gap-1 text-sm sm:gap-3" aria-label="Customer">
      <a href="{% url 'home' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-ink-muted hover:text-ink">Home</a>
      <a href="{% url 'app_home' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-ink-muted hover:text-ink">Dashboard</a>
      <a href="{% url 'design_list' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-ink-muted hover:text-ink">Designs</a>
      <a href="{% url 'order_list' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-ink-muted hover:text-ink">Orders</a>
      <a href="{% url 'account_profile' %}" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-ink-muted hover:text-ink">Profile</a>
      {% if messenger_url %}
      <a href="{{ messenger_url }}" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-11 items-center rounded-md px-2 py-1.5 text-ink-muted hover:text-ink" aria-label="Messenger">Chat</a>
      {% endif %}
      <a href="{% url 'account_logout' %}" class="inline-flex min-h-11 items-center rounded-md border border-border-strong px-2.5 py-1.5 text-ink">Log out</a>
    </nav>
  </div>
</header>
<div id="customer-nav-drawer" class="nav-drawer">
  <div class="nav-drawer-backdrop" data-nav-close></div>
  <div class="nav-drawer-panel" role="dialog" aria-label="Menu">
    <div class="mb-4 flex items-center justify-between">
      <a href="{% url 'home' %}" class="font-display text-lg text-ink" data-nav-close>Blytz</a>
      <button type="button" class="inline-flex min-h-11 min-w-11 items-center justify-center" data-nav-close aria-label="Close">×</button>
    </div>
    <nav class="flex flex-col gap-1 text-sm">
      <a href="{% url 'home' %}" class="min-h-11 rounded-md px-2 py-3" data-nav-close>Home</a>
      <a href="{% url 'app_home' %}" class="min-h-11 rounded-md px-2 py-3" data-nav-close>Dashboard</a>
      <a href="{% url 'design_list' %}" class="min-h-11 rounded-md px-2 py-3" data-nav-close>Designs</a>
      <a href="{% url 'order_list' %}" class="min-h-11 rounded-md px-2 py-3" data-nav-close>Orders</a>
      <a href="{% url 'account_profile' %}" class="min-h-11 rounded-md px-2 py-3" data-nav-close>Profile</a>
      {% if messenger_url %}<a href="{{ messenger_url }}" class="min-h-11 rounded-md px-2 py-3" data-nav-close>Messenger</a>{% endif %}
      <a href="{% url 'account_logout' %}" class="min-h-11 rounded-md px-2 py-3" data-nav-close>Log out</a>
    </nav>
  </div>
</div>
