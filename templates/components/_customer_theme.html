{% include "components/_hover_tips.html" %}
<style>
  .cp-page{background-color:#faf8f3;background-image:radial-gradient(rgba(10,10,10,.07) 1px,transparent 1px);
    background-size:14px 14px;min-height:60vh;color:#0a0a0a}
  .cp-wrap{max-width:72rem;margin:0 auto;padding:2rem 1rem 3.5rem}
  @media (min-width:640px){.cp-wrap{padding:2.5rem 1.5rem 4rem}}
  .cp-page a{text-decoration:none}
  .cp-serif{font-family:'Playfair Display',Georgia,serif}

  /* Hero */
  .cp-hero{position:relative;overflow:hidden;border-radius:1.25rem;padding:1.5rem 1.5rem 1.7rem;color:#fff;
    background:
      radial-gradient(90% 140% at 100% 0%,rgba(212,175,55,.40),transparent 60%),
      repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 10px),
      #0a0a0a;
    box-shadow:0 18px 40px rgba(10,10,10,.22)}
  .cp-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,#b8932a,#f1d97a,#b8932a)}
  .cp-hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem}
  .cp-eyebrow{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:.7rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:#D4AF37}
  .cp-h1{margin:.45rem 0 0;font-family:'Playfair Display',Georgia,serif;font-size:2rem;line-height:1.1;color:#fff}
  @media (min-width:640px){.cp-h1{font-size:2.4rem}}
  .cp-lead{margin:.4rem 0 0;font-size:.9rem;color:rgba(255,255,255,.72);max-width:34rem}

  /* Buttons */
  .cp-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.75rem;padding:.55rem 1.15rem;
    border-radius:.8rem;font-size:.88rem;font-weight:600;cursor:pointer;border:1px solid transparent;
    transition:background .15s,color .15s,box-shadow .15s,border-color .15s}
  .cp-btn-sm{min-height:2.25rem;padding:.35rem .85rem;font-size:.8rem;border-radius:.65rem}
  .cp-btn-gold{background:#D4AF37;color:#0a0a0a;box-shadow:0 6px 18px rgba(212,175,55,.35)}
  .cp-btn-gold:hover{background:#e5c04b}
  .cp-btn-dark{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
  .cp-btn-dark:hover{background:#D4AF37;border-color:#D4AF37;color:#0a0a0a}
  .cp-btn-ghost{background:#fff;color:#0a0a0a;border-color:#d9d3bf}
  .cp-btn-ghost:hover{background:#faf8f3;border-color:#D4AF37}

  /* Stat tiles */
  .cp-stats{display:grid;gap:.85rem;margin-top:1.5rem;grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (min-width:1024px){.cp-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .cp-stat{position:relative;display:flex;flex-direction:column;gap:.35rem;padding:1rem 1.1rem;border-radius:1rem;
    background:#fff;border:1px solid #e7e2d3;box-shadow:0 2px 10px rgba(10,10,10,.04)}
  .cp-stat-icon{display:inline-flex;align-items:center;justify-content:center;width:2.25rem;height:2.25rem;
    border-radius:9999px;background:#0a0a0a;color:#D4AF37}
  .cp-stat-icon svg{width:1.1rem;height:1.1rem}
  .cp-stat-label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b6759}
  .cp-stat-value{font-family:'Playfair Display',Georgia,serif;font-size:2rem;line-height:1;color:#0a0a0a}
  .cp-stat.is-accent{background:linear-gradient(135deg,#0a0a0a,#1c1a12);border-color:#D4AF37}
  .cp-stat.is-accent .cp-stat-label{color:rgba(255,255,255,.7)}
  .cp-stat.is-accent .cp-stat-value{color:#D4AF37}
  .cp-stat.is-accent .cp-stat-icon{background:#D4AF37;color:#0a0a0a}

  /* Cards + rows */
  .cp-grid2{display:grid;gap:1.5rem;margin-top:2rem}
  @media (min-width:1024px){.cp-grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .cp-card{border-radius:1.1rem;background:#fff;border:1px solid #e7e2d3;overflow:hidden;
    box-shadow:0 2px 10px rgba(10,10,10,.04)}
  .cp-card-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.9rem 1.1rem;
    border-bottom:1px solid #e7e2d3;background:linear-gradient(180deg,#fff,#faf8f3)}
  .cp-card-title{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;color:#0a0a0a}
  .cp-link{font-size:.8rem;font-weight:600;color:#8a6a00}
  .cp-link:hover{color:#0a0a0a;text-decoration:underline!important}
  .cp-list{margin:0;padding:0;list-style:none}
  .cp-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:.85rem 1.1rem;
    border-bottom:1px solid #f0ecde;transition:background .15s}
  .cp-row:last-child{border-bottom:0}
  .cp-row:hover{background:#fffdf5}
  .cp-row-main{display:flex;align-items:center;gap:.75rem;min-width:0}
  .cp-glyph{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;
    border-radius:.7rem;background:#0a0a0a;color:#D4AF37}
  .cp-glyph svg{width:1.25rem;height:1.25rem}
  .cp-row-title{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:.92rem;font-weight:600;color:#0a0a0a}
  .cp-row-title:hover{color:#8a6a00}
  .cp-row-sub{margin:.1rem 0 0;font-size:.76rem;color:#6b6759;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cp-mono{font-family:ui-monospace,Menlo,monospace}
  .cp-row-side{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem;text-align:right;flex:0 0 auto}

  /* Pills */
  .cp-pill{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:9999px;
    font-size:.7rem;font-weight:700;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
  .cp-pill.is-paid{background:#e8f5e9;color:#166534;border-color:#bfe3c6}
  .cp-pill.is-down{background:#fff6d6;color:#8a6a00;border-color:#ecd98a}
  .cp-pill.is-out{background:#fdecec;color:#b91c1c;border-color:#f3c4c4}
  .cp-pill.is-job{background:#f1efe6;color:#3b3a33;border-color:#e0dbc8}
  .cp-pill.is-warn{background:#fff6d6;color:#8a6a00;border-color:#ecd98a}
  .cp-pill.is-draft{background:#f1efe6;color:#6b6759;border-color:#e0dbc8}

  /* Payment cell */
  .cp-pay-note{margin:.3rem 0 0;font-size:.72rem;color:#6b6759}
  .cp-pay-note.is-bad{color:#b91c1c;font-weight:600}
  .cp-pay-due{margin:.35rem 0 .3rem;font-size:.78rem;color:#3b3a33}
  .cp-pay-due strong{font-family:ui-monospace,Menlo,monospace;font-size:.9rem;color:#0a0a0a}

  /* Empty state */
  .cp-empty{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:2rem 1.25rem;text-align:center}
  .cp-empty-icon{display:inline-flex;align-items:center;justify-content:center;width:3rem;height:3rem;
    border-radius:9999px;background:#0a0a0a;color:#D4AF37}
  .cp-empty-icon svg{width:1.4rem;height:1.4rem}
  .cp-empty h3{margin:.25rem 0 0;font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;color:#0a0a0a}
  .cp-empty p{margin:0 0 .5rem;font-size:.85rem;color:#6b6759;max-width:22rem}
  .cp-empty-solo{margin-top:1.5rem;border-radius:1.1rem;background:#fff;border:1px dashed #cdbf8f}

  /* Design cards */
  .cp-designs{display:grid;gap:1rem;margin-top:1.5rem;grid-template-columns:repeat(1,minmax(0,1fr))}
  @media (min-width:560px){.cp-designs{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:900px){.cp-designs{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .cp-design{display:flex;flex-direction:column;border-radius:1.1rem;overflow:hidden;background:#fff;
    border:1px solid #e7e2d3;box-shadow:0 2px 10px rgba(10,10,10,.04);transition:transform .15s,box-shadow .15s,border-color .15s}
  .cp-design:hover{transform:translateY(-2px);border-color:#D4AF37;box-shadow:0 14px 30px rgba(10,10,10,.12)}
  .cp-design-art{position:relative;display:flex;align-items:center;justify-content:center;height:8.5rem;color:#D4AF37;
    background:
      radial-gradient(70% 90% at 80% 0%,rgba(212,175,55,.35),transparent 65%),
      repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 10px),
      #0a0a0a}
  .cp-design-art svg{width:3.4rem;height:3.4rem;opacity:.95}
  .cp-design-art .cp-pill{position:absolute;top:.7rem;left:.7rem}
  .cp-design-body{display:flex;flex-direction:column;gap:.25rem;padding:.95rem 1.1rem 0}
  .cp-design-title{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;color:#0a0a0a}
  .cp-design-meta{margin:0;font-size:.78rem;color:#6b6759}
  .cp-design-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.8rem 1.1rem 1rem;margin-top:auto}
  .cp-design-date{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;color:#6b6759}

  /* Order cards */
  .cp-orders{display:flex;flex-direction:column;gap:.85rem;margin-top:1.5rem}
  .cp-order{display:grid;gap:.9rem 1rem;align-items:center;padding:1rem 1.1rem;border-radius:1.1rem;background:#fff;
    border:1px solid #e7e2d3;box-shadow:0 2px 10px rgba(10,10,10,.04);transition:border-color .15s,box-shadow .15s;
    grid-template-columns:4.5rem minmax(0,1fr)}
  .cp-order:hover{border-color:#D4AF37;box-shadow:0 12px 28px rgba(10,10,10,.1)}
  .cp-order-thumb{display:inline-flex;align-items:center;justify-content:center;width:4.5rem;height:4.5rem;overflow:hidden;
    border-radius:.9rem;border:1px solid #e7e2d3;background:#faf8f3}
  .cp-order-thumb img{width:100%;height:100%;object-fit:cover}
  .cp-order-thumb span{font-size:.62rem;line-height:1.2;color:#6b6759;text-align:center;padding:.25rem}
  .cp-order-id{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;font-weight:700;
    letter-spacing:.08em;color:#8a6a00}
  .cp-order-title{margin:.15rem 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;color:#0a0a0a}
  .cp-order-title a{color:inherit}
  .cp-order-title a:hover{color:#8a6a00}
  .cp-order-meta{margin:.2rem 0 0;font-size:.76rem;color:#6b6759}
  .cp-col-label{display:block;margin:0 0 .3rem;font-size:.64rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:#9a9482}
  .cp-order-cta{grid-column:1/-1;display:flex}
  .cp-order-cta .cp-btn{flex:1}
  @media (min-width:900px){
    .cp-order{grid-template-columns:4.5rem minmax(0,1fr) 9rem 13rem auto}
    .cp-order-cta{grid-column:auto}
    .cp-order-cta .cp-btn{flex:0 0 auto}
  }
  @media (max-width:899px){
    .cp-order-col{grid-column:1/-1}
  }

  /* Pager */
  .cp-pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-top:1.5rem;
    font-size:.82rem;color:#6b6759}
  .cp-pager-btns{display:flex;gap:.5rem}
</style>
