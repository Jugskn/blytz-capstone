<style>
  .pp-sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem}
  .pp-sheet.hidden{display:none}
  .pp-backdrop{position:absolute;inset:0;
    background:
      radial-gradient(60% 50% at 85% 0%,rgba(212,175,55,.30),transparent 70%),
      radial-gradient(50% 40% at 0% 100%,rgba(212,175,55,.15),transparent 70%),
      rgba(10,10,10,.80);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .pp-panel{position:relative;z-index:1;display:flex;flex-direction:column;width:100%;max-width:32rem;
    max-height:92dvh;overflow:hidden;border-radius:1.25rem;background:#fff;color:#0a0a0a;
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(212,175,55,.30)}

  /* Header */
  .pp-head{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;
    padding:1.25rem 1.25rem 1.2rem;color:#fff;
    background:
      radial-gradient(120% 140% at 100% 0%,rgba(212,175,55,.38),transparent 60%),
      repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 10px),
      #0a0a0a}
  .pp-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,#b8932a,#f1d97a,#b8932a)}
  .pp-eyebrow{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:.7rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:#D4AF37}
  .pp-title{margin:.4rem 0 0;font-family:'Playfair Display',Georgia,serif;font-size:1.55rem;line-height:1.15;color:#fff;
    text-transform:none;letter-spacing:normal}
  .pp-sub{margin:.35rem 0 0;font-size:.82rem;line-height:1.4;color:rgba(255,255,255,.72)}
  .pp-close{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;
    border-radius:9999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);
    color:#fff;font-size:1.4rem;line-height:1;cursor:pointer;transition:background .15s,border-color .15s}
  .pp-close:hover{background:rgba(212,175,55,.25);border-color:#D4AF37}

  /* Body */
  .pp-form{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
  .pp-body{flex:1;overflow-y:auto;padding:1.1rem 1.25rem;
    background-color:#faf8f3;
    background-image:radial-gradient(rgba(10,10,10,.07) 1px,transparent 1px);
    background-size:14px 14px}
  .pp-steps{display:flex;gap:.5rem;margin:0 0 1rem;padding:0;list-style:none}
  .pp-steps li{display:flex;align-items:center;gap:.5rem;flex:1;padding:.5rem .65rem;border-radius:.7rem;
    background:#fff;border:1px solid #e7e2d3;font-size:.78rem;font-weight:600;color:#6b6759}
  .pp-steps li span{display:inline-flex;align-items:center;justify-content:center;width:1.4rem;height:1.4rem;
    border-radius:9999px;background:#0a0a0a;color:#D4AF37;font-size:.72rem}
  .pp-timer{display:flex;align-items:center;justify-content:space-between;margin:0 0 .85rem;padding:.6rem .9rem;
    border-radius:.8rem;background:#0a0a0a;border:1px solid rgba(212,175,55,.5);
    color:rgba(255,255,255,.8);font-size:.82rem;font-weight:600}
  .pp-timer-time{font-family:ui-monospace,Menlo,monospace;font-size:1.15rem;font-weight:700;color:#D4AF37}
  .pp-notice{margin:0 0 1rem;padding:.6rem .85rem;border-radius:.8rem;border:1px solid #f3c4c4;
    background:#fff5f5;font-size:.82rem;font-weight:600;color:#b91c1c}
  .pp-field{margin:0 0 1rem}
  .pp-label{display:block;margin:0 0 .4rem;font-size:.8rem;font-weight:600;color:#0a0a0a}
  .pp-hint{margin:.4rem 0 0;font-size:.74rem;color:#6b6759}
  .pp-error{margin:.4rem 0 0;font-size:.8rem;color:#b91c1c}
  .pp-input{display:block;width:100%;min-height:2.9rem;padding:.6rem .8rem;border-radius:.75rem;
    border:1px solid #d9d3bf;background:#fff;color:#0a0a0a;font-size:1rem;transition:border-color .15s,box-shadow .15s}
  .pp-input:focus{outline:none;border-color:#D4AF37;box-shadow:0 0 0 3px rgba(212,175,55,.25)}

  /* Amount */
  .pp-amount{display:flex;align-items:center;gap:.5rem;padding:.35rem .9rem;border-radius:.9rem;
    border:1px solid #d9d3bf;background:#fff;transition:border-color .15s,box-shadow .15s}
  .pp-amount:focus-within{border-color:#D4AF37;box-shadow:0 0 0 3px rgba(212,175,55,.25)}
  .pp-amount.is-locked{background:linear-gradient(135deg,#0a0a0a,#1c1a12);border-color:#D4AF37}
  .pp-amount-cur{font-size:1.5rem;font-weight:700;color:#b8932a}
  .pp-amount-input{flex:1;min-width:0;border:0;background:transparent;padding:.4rem 0;
    font-family:ui-monospace,Menlo,monospace;font-size:1.7rem;font-weight:700;color:#0a0a0a}
  .pp-amount-input:focus{outline:none}
  .pp-amount.is-locked .pp-amount-input{color:#fff}

  /* Upload box */
  .pp-drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.35rem;min-height:9.5rem;padding:1rem;text-align:center;cursor:pointer;border-radius:1rem;
    border:2px dashed #cdbf8f;background:#fff;transition:border-color .15s,background .15s}
  .pp-drop:hover,.pp-drop.is-drag{border-color:#D4AF37;background:#fffbea}
  .pp-drop.has-file{border-style:solid;border-color:#D4AF37;background:#fffbea}
  .pp-drop-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .pp-drop-icon{display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;
    border-radius:9999px;background:#0a0a0a;color:#D4AF37}
  .pp-drop-icon svg{width:1.4rem;height:1.4rem}
  .pp-drop-title{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:.9rem;font-weight:600;color:#0a0a0a}
  .pp-drop-sub{font-size:.74rem;color:#6b6759}
  .pp-drop-thumb{max-height:6rem;max-width:100%;margin-top:.35rem;border-radius:.6rem;
    border:1px solid #e7e2d3;object-fit:contain;background:#faf8f3}

  /* Footer */
  .pp-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.6rem;
    padding:.9rem 1.25rem calc(.9rem + env(safe-area-inset-bottom));
    border-top:1px solid #e7e2d3;background:#fff}
  .pp-btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.9rem;padding:.6rem 1.25rem;
    border-radius:.8rem;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .15s,box-shadow .15s,color .15s}
  .pp-btn:disabled{opacity:.4;cursor:not-allowed}
  .pp-btn-ghost{border:1px solid #d9d3bf;background:#fff;color:#0a0a0a}
  .pp-btn-ghost:hover:not(:disabled){background:#faf8f3}
  .pp-btn-primary{border:1px solid #0a0a0a;background:#0a0a0a;color:#fff}
  .pp-btn-primary:hover:not(:disabled){background:#D4AF37;border-color:#D4AF37;color:#0a0a0a;box-shadow:0 6px 18px rgba(212,175,55,.35)}

  /* Phones: bottom sheet */
  @media (max-width:639px){
    .pp-sheet{padding:0;align-items:flex-end}
    .pp-panel{max-width:none;max-height:96dvh;border-radius:1.25rem 1.25rem 0 0}
    .pp-head{padding-top:max(1.25rem,env(safe-area-inset-top))}
    .pp-foot .pp-btn{flex:1}
  }

  /* Keep the light look inside the dark editor theme
     (also fixes the channel details / Copy buttons added by payment_details.js) */
  .blytz-dark .pp-panel input,
  .blytz-dark .pp-panel select{color-scheme:light}
  .blytz-dark .pp-panel .text-ink{color:#0a0a0a!important}
  .blytz-dark .pp-panel .text-ink-muted,
  .blytz-dark .pp-panel .text-ink-subtle{color:#6b6759!important}
  .blytz-dark .pp-panel .bg-canvas{background-color:#fff!important}
  .blytz-dark .pp-panel .bg-surface{background-color:#faf8f3!important}
  .blytz-dark .pp-panel .border-border,
  .blytz-dark .pp-panel .border-border-strong{border-color:#d9d3bf!important}
  .blytz-dark .pp-panel .hover\:bg-surface:hover{background-color:#faf8f3!important}
</style>
